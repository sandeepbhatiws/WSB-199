<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Button Color</title>
	<style type="text/css">
		body{
			text-align: center;
		}
		button{
			background: black;
			color: white;
			font-size: 18px;
			font-weight: bold;
			margin-top: 50px;
			padding: 15px 25px;
			border: 0px;
			border-radius: 15px;
			animation: colorChange;
			animation-duration: 3s;
			animation-iteration-count: infinite;
			animation-delay: 5s;
		}

		@keyframes colorChange{
			from {
				background-color: red;
				transform: scale(1.0);
			}
			to {
				background-color: blue;
				transform: scale(1.2);
			}
		}
	</style>
</head>
<body>

	<button>Click Me</button>
</body>
</html>
