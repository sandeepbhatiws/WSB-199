<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Button Color</title>
	<style type="text/css">
		.row{
			width: 200px;
			height: 200px;
			border: 0px solid red;
			margin: auto;
			margin-top: 100px;
			position: relative;
		}
		.image{
			background-color: blue;
			width: 100%;
			height: 100%;
			border-radius: 50%;
			text-align: center;
			padding-top: 35px;
			box-sizing: border-box;
			position: relative;
			z-index: 9;
		}
		.content{
			background-color: blue;
			width: 100%;
			height: 100%;
			border-radius: 50%;
			text-align: center;
			padding-top: 35px;
			box-sizing: border-box;
			position: absolute;
			top: 0px;
			left: 0px;
			opacity: 0;
			animation: colorChange;
			animation-duration: 3s;
			animation-iteration-count: infinite;
			animation-timing-function: linear;
		}

		@keyframes colorChange{
			0%{
				opacity: 0.1;
				transform: scale(1.0);
			}
			50%{
				opacity: 1.3;
				transform: scale(1.3);
			}
			100%{
				opacity: 0.1;
				transform: scale(1.0);
			}
		}

		.content1{
			background-color: blue;
			width: 100%;
			height: 100%;
			border-radius: 50%;
			text-align: center;
			padding-top: 35px;
			box-sizing: border-box;
			position: absolute;
			top: 0px;
			left: 0px;
			opacity: 0;
			animation: colorChange;
			animation-duration: 5s;
			animation-iteration-count: infinite;
			animation-timing-function: linear;
		}
	</style>
</head>
<body>

	<div class="row">
		<div class="image">
			<img src="https://www.wscubetech.com/images/home-images/pdf-icon.svg">
		</div>
		<div class="content"></div>
	</div>

	<div class="row">
		<div class="image">
			<img src="https://www.wscubetech.com/images/home-images/pdf-icon.svg">
		</div>
		<div class="content1"></div>
	</div>
	
</body>
</html>
