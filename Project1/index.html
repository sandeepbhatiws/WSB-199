<!DOCTYPE html>
<html>
<head>
	<title>Project 1</title>
	<style type="text/css">
		.building{
			width: 1000px;
			height: 540px;
			border: 2px solid black;
			/*margin-top: 50px;
			margin-left: 50px;
			margin-right: 100px;
			margin-bottom: 50px;*/

/*			margin: 15px 30px 40px 50px;*/

			margin: auto;
		}
		.floor1{
			width: 1000px;
			height: 100px;
			border: 1px solid black;
			box-sizing: border-box;
			text-align: center;
			padding-top: 10px;
		}

		.floor2{
			width: 1000px;
			height: 40px;
			display: flex;
		}
		.floor2room{
			width: 200px;
			height: 40px;
			padding-top: 10px;
			border: 1px solid black;
			box-sizing: border-box;
			text-align: center;
			font-weight: bold;
		}

		.floor3{
			width: 1000px;
			height: 200px;
			border: 1px solid black;
			box-sizing: border-box;
			display: flex;
		}
		.floor3_left{
			width: 250px;
			height: 200px;
			border: 1px solid black;
			box-sizing: border-box;
		}
		.floor3_right{
			width: 750px;
			height: 200px;
			border: 1px solid black;
			box-sizing: border-box;
		}
		.floor3image{
			width: 100%;
			height: 100%;
		}

	</style>
</head>
<body>
	<div class="building">
		<div class="floor1">
			<h1>WSCUBETECH</h1>
		</div>

		<div class="floor2">
			<div class="floor2room">Home</div>
			<div class="floor2room">About Us</div>
			<div class="floor2room">Course</div>
			<div class="floor2room">Gallery</div>
			<div class="floor2room">Contact Us</div>
		</div>

		<div class="floor3">
			<div class="floor3_left">
				<div class="floor3room">Home</div>
				<div class="floor3room">About Us</div>
				<div class="floor3room">Course</div>
				<div class="floor3room">Gallery</div>
				<div class="floor3room">Contact Us</div>
			</div>
			<div class="floor3_right">
				<img src="images/2.jpg" class="floor3image">
			</div>
		</div>
	</div>
</body>
</html>
