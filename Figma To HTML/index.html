<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Figma to HTML</title>

		<link rel="stylesheet" type="text/css" href="css/style.css">
		<link rel="stylesheet" type="text/css" href="css/responsive.css">
	</head>
	<body>
		<div class="main">
			
			<!-- Start Header Section -->
			<header class="outer_header">
				<div class="header">
					<div class="header_left">
						<img src="images/logo.svg">
					</div>
					<div class="header_right">
						<div class="outer_header_right">
							<div class="whatsup">
								<img src="images/whatsup.svg">
							</div>
							<div class="chat_with_us">Chat With Us</div>
						</div>
						<div class="call_us">
							Call Us
						</div>
					</div>
				</div>
			</header>
			<!-- End Header Section -->

			<section class="outer_career">
				<div class="inner_career">
					<div class="career_left">
						<div class="career_content">
							<h1>Career Opportunities in <span>Digital Marketing</span></h1>
							<p>Digital marketing course so good,you only pay-after-placement</p>
							<div class="content">
								<div class="content_image">
									<img src="images/circle_tick.svg" />
								</div>
								<div>
									Specialization: Performance Marketing
								</div>
							</div>
							<div class="content">
								<div class="content_image">
									<img src="images/circle_tick.svg" />
								</div>
								<div>
									Min salary of Rs 4.5 LPA
								</div>
							</div>
							<div class="content">
								<div class="content_image">
									<img src="images/circle_tick.svg" />
								</div>
								<div>
									50 seats only
								</div>
							</div>
						</div>
						<div class="career_buttons">
							<button class="book_demo">Book 2 Days Demo</button>
							<button class="download_curriculam">
								<div>
									<img src="images/download.svg">
								</div>
								<div class="curriculam">
									Download Curriculum
								</div>
							</button>	
						</div>
					</div>
					<div class="career_right">
						
					</div>
				</div>
			</section>

		</div>
	</body>
</html>
