<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checkout — Gooey Store</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    form{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
    label{display:flex;flex-direction:column;font-size:14px}
    .summary{background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;margin-bottom:12px}
  </style>
</head>
<body>
  <main class="page">
    <nav class="site-nav" style="margin-bottom:16px">
      <div class="site-brand"><div class="logo">G</div><div style="font-weight:700;color:#fff">Gooey Store</div></div>
      <div><a href="shop.html" class="btn secondary">Back to shop</a></div>
    </nav>

    <h1>Checkout</h1>
    <div class="summary" id="summary"></div>

    <form id="checkoutForm">
      <label>Full name<input name="name" required></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Address<textarea name="address" required></textarea></label>
      <div style="display:flex;gap:8px"><button type="submit" class="btn">Place Order</button><a href="shop.html" class="btn secondary">Cancel</a></div>
    </form>
  </main>

  <script>
    function getCart(){ try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){return []} }
    async function loadSummary(){
      const cart = getCart();
      const products = await fetch('products.json').then(r=>r.json());
      let html = '';
      let total=0;
      for(const it of cart){ const p = products.find(x=>x.id===it.id); if(!p) continue; total += p.price*it.qty; html += `<div>${p.name} × ${it.qty} — $${(p.price*it.qty).toFixed(2)}</div>` }
      html += `<div style="margin-top:8px;font-weight:800">Total: $${total.toFixed(2)}</div>`;
      document.getElementById('summary').innerHTML = html;
    }
    document.getElementById('checkoutForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      localStorage.removeItem('cart');
      alert('Order placed — this is a demo.');
      window.location.href = 'shop.html';
    });
    loadSummary();
  </script>
</body>
</html>
