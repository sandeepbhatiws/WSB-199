<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Image Changer </title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        main {
            width: 800px;
            height: auto;
            padding: 10px;
            border: 0.1px solid red;
            margin: 50px auto;
        }
        #frame {
            width: 100%;
            height: 300px;
            text-align: center;
        }
        #frame img{
            width: 30%;
        }
        img {
            width: 100%;
            height: 100%;
        }
        .boxes {
            width: 100%;
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
        }
        .box {
            width: 20%;
            height: 200px;
            border: 0.1px solid red;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <div id="frame">
            <img src="images/1.png" alt="">
        </div>
        <div class="boxes">
        </div>
    </main>
</body>
<script>

    var images = ['images/1.png','images/2.png','images/3.png'];
    var imageDiv = '';

    images.forEach((img) => {
        // imageDiv += '<div class="box"> <img src="'  + img  +   '" alt=""> </div>';
        imageDiv += `<div class="box">
                <img src="${ img }" alt="" class="image">
            </div>`;
    })

    document.querySelector('.boxes').innerHTML = imageDiv;

    var allImages = document.querySelectorAll('.image');
    allImages.forEach((v) => {
        v.addEventListener('click', (event) => {
            console.log(event.target);
        })
    })

</script>
</html>
