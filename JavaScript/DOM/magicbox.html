<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .row{
            width: 450px;
            display: flex;
            margin: auto;
            flex-wrap: wrap;
        }
        .column{
            width: 150px;
            height: 150px;
            text-align: center;
            padding-top: 70px;
            font-weight: bold;
            box-sizing: border-box;
            border: 1px solid black;
            background-color: gray;
            font-size: 20px;
        }
    </style>
</head>
<body>
    

    <div class="row">
        <div class="column" onmouseenter="colorChange(this)" onmouseleave="defaultColor(this)">1</div>
        <div class="column" onmouseenter="colorChange(this)" onmouseleave="defaultColor(this)">2</div>
        <div class="column" onmouseenter="colorChange(this)" onmouseleave="defaultColor(this)">3</div>
        <div class="column" onmouseenter="colorChange(this)" onmouseleave="defaultColor(this)">4</div>
        <div class="column" onmouseenter="colorChange(this)" onmouseleave="defaultColor(this)">5</div>
        <div class="column" onmouseenter="colorChange(this)" onmouseleave="defaultColor(this)">6</div>
        <div class="column" onmouseenter="colorChange(this)" onmouseleave="defaultColor(this)">7</div>
        <div class="column" onmouseenter="colorChange(this)" onmouseleave="defaultColor(this)">8</div>
        <div class="column" onmouseenter="colorChange(this)" onmouseleave="defaultColor(this)">9</div>
    </div>
    <script>
        var numbers = [];

        function colorChange(event){
            if(numbers.length < 9){
                event.style.backgroundColor = 'red';
            }

            if(!numbers.includes(event.innerText)){
                numbers.push(event.innerText);
            }
        }

        function defaultColor(event){
            event.style.backgroundColor = 'gray';
        }

    </script>
</body>
</html>
