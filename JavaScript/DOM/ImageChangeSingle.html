<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .row{
            max-width: 600px;
            margin: auto;
            margin-top: 100px;
            display: flex;
            gap: 25px;
        }
        .image{
            flex-basis: 50%;
        }
        .image img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    
    <div class="row">
        <div class="image" onmouseover="imageChanger('images/3.png')" onmouseout="imageChanger('images/1.png')">
            <img src="images/1.png" id="image1"/>
        </div>
    </div>

    <script>
        function imageChanger(image){
            document.getElementById('image1').src = image;
        }

    </script>
</body>
</html>
