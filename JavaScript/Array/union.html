<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var a = [1,2,3,4,4];
        var b = [3,4,5,4];

        var output = [];


        for(var data of a){
            if(b.includes(data) && !output.includes(data)){
                output.push(data);
            }
        }

        console.log(output);

    </script>

</body>
</html>
