<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Function</title>
</head>
<body>

    <button onclick="userInfo()">On Click</button>
    <button onclick="add()">Add</button>
    <button onclick="minus()">Minus</button>

    <script>

        

        function userInfo(){
            console.log('Welcome');
        }

        function add(){
            var a = 25;
            var b = 15;
            c = a +b;
            console.log(c)
        }

        function minus(){
            c = a - b;
            console.log(c)
        }


        var output = userInfo();

        console.log(output);


    </script>
</body>
</html>
