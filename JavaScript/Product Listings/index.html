<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Product Listings</title>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<header class="site-header">
			<div class="container header-inner">
				<div class="brand">
					<h1>Arcadia Goods</h1>
				</div>
				<div class="header-actions">
					<input id="search" class="search" placeholder="Search products..." aria-label="Search products">
					<button class="icon-btn" id="cartBtn" aria-label="Open cart">🛒 <span id="cartCount" class="cart-count">0</span></button>
				</div>
			</div>
		</header>

		<main class="container main">
			<section id="products" class="product-grid" aria-live="polite">
				<!-- Product cards -->
				

				
			</section>
		</main>

		<div id="toast" class="toast" aria-hidden="true"></div>

		<script src="js/custom.js"></script>
	</body>
</html>
